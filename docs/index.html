    <script>
      // Хаяг «#»-гүй (kinomandal.com/movie/<id>): Facebook/Messenger #-ийн араас юу ч
      // уншдаггүй тул хуулж явуулсан линкэнд киноны нэр, зураг гардаггүй байв.
      // GitHub-ийн нөөц хаяг (дэд зам /mini-drama/) л хуучнаараа #/... — бусад бүх
      // домэйн (kinomandal.com, ирээдүйн шинэ домэйн, preview) #-гүй.
      (function () {
        var h = location.hostname;
        if (/\.github\.io$/.test(h)) return;
        // Бүх харьцангуй хаяг (posters/..., assets/...) сайтын үндэснээс — /movie/x дээр ч
        document.write('<base href="/">');
        // Хуучин #/... линк (өмнө нь хуваалцсан, QPay-ээс буцах г.м) → #-гүй хаяг
        if (location.hash.indexOf("#/") === 0) {
          var r = location.hash.slice(1), q = r.indexOf("?");
          var path = q < 0 ? r : r.slice(0, q), hq = q < 0 ? "" : r.slice(q);
          var query = hq && location.search ? hq + "&" + location.search.slice(1) : hq || location.search;
          history.replaceState(null, "", path + query);
        }
      })();
    </script>
