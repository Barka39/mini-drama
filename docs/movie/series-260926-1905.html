      (function () {
        var h = location.hostname;
        if (/\.github\.io$/.test(h)) return;

        if (location.hash.indexOf("#/") === 0) {
          var r = location.hash.slice(1), q = r.indexOf("?");
          var path = q < 0 ? r : r.slice(0, q), hq = q < 0 ? "" : r.slice(q);
          var query = hq && location.search ? hq + "&" + location.search.slice(1) : hq || location.search;
          history.replaceState(null, "", path + query);
        }
      })();
